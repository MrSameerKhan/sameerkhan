# --- Deliberate structure summary (§5.3), for build_taxonomy.py to validate against ---
# - Deep fan-out:            tax_return has 43 leaf classes (>= 40 required)
# - Near-duplicate pairs (>=6, detected by name-distance in defects.py, no explicit flag needed):
#     title_commitment / title_policy
#     promissory_note / subordinate_promissory_note
#     warranty_deed / special_warranty_deed
#     verification_of_employment / verbal_verification_of_employment
#     flood_determination / life_of_loan_flood_determination

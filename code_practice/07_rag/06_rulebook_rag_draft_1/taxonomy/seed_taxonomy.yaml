# Hand-curated seed taxonomy — §5, reduced scope (confirmed with user: ~150 target, 100 floor).
#
# Fields per class: class_id, class_name, form_number (null for generic/non-numbered documents),
# structured (true = has an official numbered form; false = free-text/varies-by-issuer document),
# real_text_available (true = a real public PDF exists per §19 sources; false = generic industry
# document with no official blank-form URL — synthetic-only per §19.4).
#
# `held_back` is NOT set here — build_taxonomy.py assigns it via a seeded (42) random draw over
# eligible classes (excluding both members of every near-duplicate / context-dependent pair, so
# a pair is never split across index/held-back), per §5.3(4)'s "random, not hand-picked" rule.
#
# `context_dependent` + `pair_with` mark the §5.3(3) same-document-different-purpose pairs —
# not a formal §6.1 taxonomy field, but the flag Phase 3's rulebook generation needs to know
# which classes must carry `abstain_guidance` (§6.2). Near-duplicate pairs (§5.3(2)) need no
# such flag — defects.py's near_duplicate_names() finds those by name-distance alone.


# Every download URL + fetch policy. §19.1. Edit this file when a link rots — never hardcode
# URLs in Python. Currently IRS-only (confirmed working via direct HTTP test); Fannie
# Mae/Freddie Mac/CFPB/HUD are blocked by CDN-level bot protection (Cloudflare/Akamai) even with
# a browser user-agent — those 22 classes are marked real_text_available: false in the taxonomy
# and rely on synthetic-only generation until a working access path is found.

fetch_policy:
  user_agent: "rulebook-rag/1.0 (personal research project)"
  delay_seconds: 1.0
  timeout_seconds: 30
  retries: 2
  cache_dir: data/pdfs
  skip_if_cached: true

